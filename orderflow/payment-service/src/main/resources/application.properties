spring.application.name=payment-service
spring.jpa.hibernate.ddl-auto=validate

# ─── DataSource ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5434/payment_db
spring.datasource.username=user_payment
spring.datasource.password=payment

# ─── JPA / Hibernate ──────────────────────────────────────────
# Hibernate NEVER creates/updates schema — Flyway owns DDL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Flyway ───────────────────────────────────────────────────
# Flyway is the only source of DDL
spring.flyway.validate-migration-naming=true