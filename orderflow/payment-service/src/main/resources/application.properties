spring.application.name=payment-service
#postgresql://user_b:password_b@localhost:5434/db_b

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Ensure Flyway runs before JPA validation
spring.jpa.defer-datasource-initialization=false


# ─── DataSource ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5434/payment_db
spring.datasource.username=user_payment
spring.datasource.password=payment

# ─── JPA / Hibernate ──────────────────────────────────────────
# Hibernate NEVER creates/updates schema — Flyway owns DDL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Flyway ───────────────────────────────────────────────────
# Flyway is the only source of DDL
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true