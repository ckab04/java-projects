services:
  postgres-service-a:
    image: postgres:16
    container_name: postgres-service-order
    environment:
      POSTGRES_USER: user_order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data_a:/var/lib/postgresql/data          # correct container path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_order -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-service-b:
    image: postgres:16
    container_name: postgres-service-payment
    environment:
      POSTGRES_USER: user_payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - pg_data_b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_payment -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data              # container path
    volumes:
      - kafka_data:/var/lib/kafka/data                 # named volume -> container path

volumes:
  pg_data_a:
  pg_data_b:
  kafka_data: